name: plateful
description: "Plateful — cut food waste with AI, scanning, and saved lists."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.2.2
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_card_swiper: ^7.0.1
  camera: ^0.12.1
  phosphor_icons: ^3.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  wakelock_plus: ^1.3.2
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
